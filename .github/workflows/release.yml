name: Release Consiglio

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag matching package.json, for example v0.1.0'
        required: true
        type: string
      allow_unsigned:
        description: 'Publish unsigned macOS and Windows packages when signing secrets are not configured (manual runs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$REQUESTED_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag $REQUESTED_TAG must match package.json version v$PACKAGE_VERSION" >&2
            exit 1
          fi
          HERMES_VERSION="$(sed -n 's/^project(ConsiglioHermes VERSION \([0-9.]*\).*/\1/p' src-hermes/CMakeLists.txt)"
          if [[ "$HERMES_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "src-hermes/CMakeLists.txt version $HERMES_VERSION must match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify application
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Create release SBOM
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          npm sbom --omit=dev --sbom-format=spdx --sbom-type=application > "Consiglio-${PACKAGE_VERSION}.spdx.json"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Consiglio-release-metadata
          path: Consiglio-*.spdx.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            command: package:linux
            artifact: Consiglio-linux-x64
          - name: Windows x64
            runner: windows-2022
            command: package:release:win
            artifact: Consiglio-windows-x64
          - name: macOS x64
            runner: macos-15-intel
            command: package:release:mac
            artifact: Consiglio-macos-x64
          - name: macOS arm64
            runner: macos-15
            command: package:release:mac
            artifact: Consiglio-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require macOS signing and notarization credentials
        id: mac_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$ALLOW_UNSIGNED" == "true" ]]; then
            echo "::warning::Building UNSIGNED, un-notarized macOS packages (missing: ${missing[*]}); allow_unsigned was set on this manual run."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Require Windows signing credentials
        id: win_signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned && 'true' || 'false' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $missing = @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD') | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if (-not $missing) {
            "signed=true" >> $env:GITHUB_OUTPUT
          } elseif ($env:ALLOW_UNSIGNED -eq 'true') {
            Write-Output "::warning::Building UNSIGNED Windows packages (missing: $($missing -join ', ')); allow_unsigned was set on this manual run."
            "signed=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: npm run ${{ matrix.command }}

      - name: Package signed and notarized macOS application
        if: runner.os == 'macOS' && steps.mac_signing.outputs.signed == 'true'
        run: npm run ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package signed Windows application
        if: runner.os == 'Windows' && steps.win_signing.outputs.signed == 'true'
        run: npm run ${{ matrix.command }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package unsigned macOS application (explicitly allowed)
        if: runner.os == 'macOS' && steps.mac_signing.outputs.signed == 'false'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package unsigned Windows application (explicitly allowed)
        if: runner.os == 'Windows' && steps.win_signing.outputs.signed == 'false'
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate package internals
        run: npm run validate:package
        env:
          REQUIRE_CODE_SIGNING: ${{ (steps.mac_signing.outputs.signed == 'true' || steps.win_signing.outputs.signed == 'true') && 'true' || 'false' }}
          REQUIRE_NOTARIZATION: ${{ steps.mac_signing.outputs.signed == 'true' && 'true' || 'false' }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Consiglio-*.AppImage
            dist/Consiglio-*.deb
            dist/Consiglio-*.dmg
            dist/Consiglio-*.zip
            dist/Consiglio-*.exe
          if-no-files-found: error
          retention-days: 30

  hermes-package:
    name: Package Hermes client ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            qt: apt
          - name: Windows x64
            runner: windows-2022
            platform: win
            arch: x64
            qt: aqt
            qt_arch: win64_msvc2019_64
          - name: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            qt: aqt
            qt_arch: clang_64
          - name: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            qt: brew
    defaults:
      run:
        shell: bash
        working-directory: src-hermes
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The native client has no Developer ID / Authenticode signing yet, so
      # macOS and Windows packages are only published on a manual run that
      # explicitly allows unsigned packages. A tag push fails closed here.
      - name: Require explicit opt-in for unsigned packages
        if: runner.os != 'Linux'
        env:
          ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned && 'true' || 'false' }}
        run: |
          if [[ "$ALLOW_UNSIGNED" != "true" ]]; then
            echo "The Hermes client is not code-signed on ${{ runner.os }} yet; run the release manually with allow_unsigned to publish it." >&2
            exit 1
          fi
          echo "::warning::Building an UNSIGNED Hermes client for ${{ matrix.name }} (ad-hoc signed on macOS); allow_unsigned was set on this manual run."

      - name: Install Qt 5 (apt)
        if: matrix.qt == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools libqt5svg5-dev file dpkg-dev
          echo "QMAKE=/usr/lib/qt5/bin/qmake" >> "$GITHUB_ENV"
          echo "QT_SOURCE=Ubuntu 24.04 packages" >> "$GITHUB_ENV"

      - name: Install Qt 5 (Homebrew)
        if: matrix.qt == 'brew'
        run: |
          brew install qt@5
          prefix="$(brew --prefix qt@5)"
          echo "QT_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "QT_SOURCE=Homebrew qt@5" >> "$GITHUB_ENV"

      - name: Install Qt 5 (official binaries)
        if: matrix.qt == 'aqt'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '5.15.2'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Prepare official Qt
        if: matrix.qt == 'aqt'
        run: |
          echo "QT_SOURCE=Qt online installer (aqtinstall)" >> "$GITHUB_ENV"
          extras="$QT_ROOT_DIR/lib/cmake/Qt5Gui/Qt5GuiConfigExtras.cmake"
          if [[ "${{ runner.os }}" == "macOS" && -f "$extras" ]]; then
            sed -i '' -e 's#;/System/Library/Frameworks/AGL.framework##g' -e 's#/System/Library/Frameworks/AGL.framework;##g' "$extras"
          fi

      - name: Build and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release ${QT_ROOT_DIR:+-DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"}
          cmake --build build-ci --config Release --parallel
          if [[ "${{ runner.os }}" == "Windows" ]]; then exclude=(-LE posix); else exclude=(); fi
          ctest --test-dir build-ci -C Release --output-on-failure "${exclude[@]}"

      - name: Package
        env:
          BUILD_DIR: ${{ github.workspace }}/src-hermes/build-package
          SBOM_INPUT: ${{ github.workspace }}/sbom-input/hermes-${{ matrix.platform }}-${{ matrix.arch }}.json
        run: bash packaging/package.sh ${{ matrix.platform }} ${{ matrix.arch }} "$GITHUB_WORKSPACE/dist-hermes"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Consiglio-Hermes-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-hermes/Consiglio-Hermes-*
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-sbom-input-${{ matrix.platform }}-${{ matrix.arch }}
          path: sbom-input/*.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [verify, package, hermes-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout (SBOM tooling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Consiglio-*
          path: release-artifacts
          merge-multiple: true

      - name: Download Hermes SBOM inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hermes-sbom-input-*
          path: sbom-inputs
          merge-multiple: true

      - name: Create Hermes client SBOM
        run: node scripts/hermes-sbom.mjs --dir release-artifacts --inputs sbom-inputs

      - name: List release files
        run: ls -la release-artifacts

      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum Consiglio-* > SHA256SUMS.txt

      - name: Attest release provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-checksums: release-artifacts/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Consiglio ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
