name: CI

on:
  push:
    branches: [slave, main, develop]
  pull_request:
    branches: [slave, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2022
          - name: macOS
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check application
        run: npm run typecheck

      - name: Test application
        run: npm test

      - name: Build application
        run: npm run build

      - name: Set up Python (for the Open Interpreter bootstrap)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Real first-run installs into a user-data folder whose path has a space,
      # exactly as the app does on this platform, then runs both front ends.
      - name: Bootstrap smoke test (real Codex + Open Interpreter install)
        run: node scripts/bootstrap-smoke.mts

  hermes:
    name: Hermes client on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            qt: apt
          - name: Windows x64
            runner: windows-2022
            platform: win
            arch: x64
            qt: aqt
            qt_arch: win64_msvc2019_64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            qt: aqt
            qt_arch: clang_64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            qt: brew
    defaults:
      run:
        shell: bash
        working-directory: src-hermes
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Qt 5 (apt)
        if: matrix.qt == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools libqt5svg5-dev file dpkg-dev
          echo "QMAKE=/usr/lib/qt5/bin/qmake" >> "$GITHUB_ENV"
          echo "QT_SOURCE=Ubuntu 24.04 packages" >> "$GITHUB_ENV"

      - name: Install Qt 5 (Homebrew)
        if: matrix.qt == 'brew'
        run: |
          brew install qt@5
          prefix="$(brew --prefix qt@5)"
          echo "QT_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "QT_SOURCE=Homebrew qt@5" >> "$GITHUB_ENV"

      - name: Install Qt 5 (official binaries)
        if: matrix.qt == 'aqt'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '5.15.2'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Record Qt source
        if: matrix.qt == 'aqt'
        run: |
          echo "QT_SOURCE=Qt online installer (aqtinstall)" >> "$GITHUB_ENV"
          # Qt 5.15.2's CMake config still links AGL.framework, which current
          # macOS SDKs no longer ship. Drop it (OpenGL.framework stays).
          extras="$QT_ROOT_DIR/lib/cmake/Qt5Gui/Qt5GuiConfigExtras.cmake"
          if [[ "${{ runner.os }}" == "macOS" && -f "$extras" ]]; then
            sed -i '' -e 's#;/System/Library/Frameworks/AGL.framework##g' -e 's#/System/Library/Frameworks/AGL.framework;##g' "$extras"
            grep -n "Frameworks" "$extras" || true
          fi

      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release ${QT_ROOT_DIR:+-DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"}

      - name: Build
        run: cmake --build build-ci --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The ACP and main-window suites drive the fake agent through a POSIX
          # shell wrapper; Windows runs the setup and command-catalog suites.
          if [[ "${{ runner.os }}" == "Windows" ]]; then exclude=(-LE posix); else exclude=(); fi
          ctest --test-dir build-ci -C Release --output-on-failure "${exclude[@]}"

      - name: Package
        env:
          BUILD_DIR: ${{ github.workspace }}/src-hermes/build-package
          SBOM_INPUT: ${{ github.workspace }}/sbom-input/hermes-${{ matrix.platform }}-${{ matrix.arch }}.json
        run: bash packaging/package.sh ${{ matrix.platform }} ${{ matrix.arch }} "$GITHUB_WORKSPACE/dist-hermes"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Consiglio-Hermes-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist-hermes/Consiglio-Hermes-*
          if-no-files-found: error
          retention-days: 14

  mobile-web:
    name: Verify mobile client
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Verify mobile application
        run: npm run build

      - name: Audit mobile production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload mobile web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-web-${{ github.sha }}
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 30

  mobile-android:
    name: Build Android client
    needs: mobile-web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and sync mobile client
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Consiglio-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  mobile-ios:
    name: Build iOS client
    needs: mobile-web
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install and sync mobile client
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Build iOS simulator application
        working-directory: mobile/ios/App
        run: >-
          xcodebuild
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify iOS simulator application
        run: test -d mobile/ios/App/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      - name: Upload iOS simulator application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Consiglio-ios-simulator-${{ github.sha }}
          path: mobile/ios/App/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            command: package:linux
            artifact: Consiglio-linux-x64
          - name: Windows x64
            runner: windows-2022
            command: package:win
            artifact: Consiglio-windows-x64
          - name: macOS Intel
            runner: macos-15-intel
            command: package:mac
            artifact: Consiglio-macos-x64
          - name: macOS Apple Silicon
            runner: macos-15
            command: package:mac
            artifact: Consiglio-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run ${{ matrix.command }}

      - name: Validate package internals
        run: npm run validate:package

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist/Consiglio-*.AppImage
            dist/Consiglio-*.deb
            dist/Consiglio-*.dmg
            dist/Consiglio-*.zip
            dist/Consiglio-*.exe
          if-no-files-found: error
          retention-days: 14
